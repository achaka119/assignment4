<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
   
</head>
<body>
    <h1>User Profile</h1>
    <form id="profileForm">
        <div class="field">
            <label for="name">Username</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="field">
            <label for="birthYear">Birth Year</label>
            <input type="number" id="birthYear" name="birthYear" min="1900" step="1" required>
        </div>

        <label for="isDeveloper">
            <input type="checkbox" id="isDeveloper"> I am a developer
        </label>

        <br>
        <button type="submit">Create / Update Profile</button>
    </form>

    <section>
        <h2>Profile Information</h2>
        <p>Name: <span id="profileName"></span></p>
        <p>Age: <span id="profileAge"></span></p>
        <p>Developer: <span id="profileDeveloper"></span></p>
        <p>Total hobbies: <span id="hobbyCount"></span></p>
    </section>

    <section>
        <h2>Hobbies</h2>
        <label for="newHobby">New hobby:</label>
        <input type="text" id="newHobby" placeholder="Enter a hobby">
        <button type="button" id="addItem">Add Item</button>
        <button type="button" id="removeItem">Remove Item</button>
        <ul id="hobbyList"></ul>
    </section>
</body>
</html>
